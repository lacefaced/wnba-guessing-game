<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WNBA Matchup</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap');
    :root { --ink: #17222c; --muted: #71808b; --paper: #f5f1e9; --white: #fffdf8; --coral: #f05a47; --coral-dark: #c63e35; --mint: #b8e6d1; --shadow: 0 14px 0 rgba(23,34,44,.08); }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: Manrope, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .3; background-image: radial-gradient(#c9c2b6 1px, transparent 1px); background-size: 18px 18px; }
    main { position: relative; width: min(1120px, calc(100% - 36px)); margin: 0 auto; padding: 34px 0 58px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 42px; }
    .kicker { margin: 0 0 8px; color: var(--coral-dark); font: 500 12px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { max-width: 600px; margin: 0; font: 42px/1.02 'Archivo Black', sans-serif; text-transform: uppercase; }
    .intro { max-width: 310px; margin: 14px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .scoreboard { display: flex; align-items: center; gap: 24px; padding: 14px 18px; border: 1px solid var(--ink); background: var(--white); box-shadow: 5px 5px 0 var(--ink); }
    .score-number { font: 28px 'Archivo Black', sans-serif; }
    .score-label { display: block; color: var(--muted); font: 10px 'DM Mono', monospace; letter-spacing: .1em; text-transform: uppercase; }
    .game-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .game-bar h2 { margin: 0; font: 21px 'Archivo Black', sans-serif; text-transform: uppercase; }
    .round-label { color: var(--muted); font: 12px 'DM Mono', monospace; }
    .board { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; align-items: start; }
    .column-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 10px; font: 11px 'DM Mono', monospace; letter-spacing: .09em; text-transform: uppercase; }
    .column-title span { color: var(--muted); font-size: 10px; }
    .cards { display: grid; gap: 12px; }
    .player-card, .team-card { width: 100%; border: 1px solid var(--ink); color: var(--ink); background: var(--white); box-shadow: var(--shadow); text-align: left; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    .player-card { display: grid; grid-template-columns: 68px 1fr; min-height: 76px; padding: 5px; align-items: center; cursor: pointer; }
    .player-card:hover:not(:disabled), .team-card:hover:not(:disabled) { transform: translate(-3px, -3px); box-shadow: 7px 7px 0 rgba(23,34,44,.14); }
    .player-card img { width: 60px; height: 64px; object-fit: cover; object-position: top center; background: var(--mint); }
    .player-name { padding: 0 10px; font-weight: 800; font-size: 15px; line-height: 1.2; }
    .team-card { display: flex; align-items: center; min-height: 64px; padding: 0 18px; cursor: pointer; font: 800 15px Manrope, sans-serif; }
    button { font: inherit; }
    button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    .player-card:disabled, .team-card:disabled { cursor: default; }
    .player-card.matched, .team-card.matched { background: var(--mint); border-color: #5c9c7e; box-shadow: none; transform: none; }
    .team-card.wrong { background: #ffd8d1; border-color: var(--coral); animation: shake .3s ease; }
    .player-card.selected { border: 3px solid var(--coral); padding: 5px; transform: translate(-2px,-2px); box-shadow: 6px 6px 0 rgba(240,90,71,.2); }
    .player-card.selected img { width: 60px; height: 62px; }
    .status { min-height: 28px; margin: 26px 0 0; color: var(--muted); font: 12px 'DM Mono', monospace; text-align: center; }
    .status.success { color: #2d7d58; } .status.error { color: var(--coral-dark); }
    .new-round { display: block; margin: 8px auto 0; padding: 13px 22px; border: 1px solid var(--ink); background: var(--ink); color: var(--white); cursor: pointer; font: 800 13px Manrope, sans-serif; text-transform: uppercase; }
    .new-round:hover { background: var(--coral); border-color: var(--coral); } .hidden { display: none; }
    .share-panel { max-width: 360px; margin: 20px auto 0; padding: 16px; border: 1px solid var(--ink); background: var(--white); text-align: center; }
    .share-heading { margin: 0 0 5px; font: 16px 'Archivo Black', sans-serif; text-transform: uppercase; }
    .share-result { margin: 0 0 14px; color: var(--muted); font: 12px 'DM Mono', monospace; }
    .share-button { padding: 10px 16px; border: 1px solid var(--coral); background: var(--coral); color: white; cursor: pointer; font: 800 12px Manrope, sans-serif; text-transform: uppercase; }
    .share-button:hover { background: var(--coral-dark); border-color: var(--coral-dark); }
    @keyframes shake { 25% { transform: translateX(5px); } 75% { transform: translateX(-5px); } }
    @media (max-width: 700px) { main { width: min(100% - 24px, 560px); padding-top: 24px; } header { display: block; margin-bottom: 30px; } h1 { font-size: 34px; } .intro { max-width: none; margin-bottom: 20px; } .scoreboard { width: fit-content; } .board { grid-template-columns: 1fr; gap: 25px; } .team-column { order: 2; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="kicker">WNBA / 2026 season</p><h1>Find the home team.</h1><p class="intro">Match each player to the team they play for. Trust your basketball brain.</p></div>
      <div class="scoreboard" aria-label="Game score"><div><span id="score" class="score-number">0</span><span class="score-label">matched</span></div><div><span id="streak" class="score-number">0</span><span class="score-label">streak</span></div></div>
    </header>
    <section aria-labelledby="round-title">
      <div class="game-bar"><h2 id="round-title">Round one</h2><span id="roundLabel" class="round-label">06 matches</span></div>
      <div class="board"><div class="player-column"><h3 class="column-title">Players <span>select a card</span></h3><div id="playerCards" class="cards"></div></div><div class="team-column"><h3 class="column-title">Teams <span>then make a match</span></h3><div id="teamCards" class="cards"></div></div></div>
      <p id="status" class="status" role="status" aria-live="polite">Select a player to get started.</p><button id="newRound" class="new-round hidden" type="button">Play another round</button>
      <div id="sharePanel" class="share-panel hidden"><h3 class="share-heading">Round complete</h3><p id="shareResult" class="share-result"></p><button id="shareButton" class="share-button" type="button">Share my score</button></div>
    </section>
  </main>
  <script src="players.js?v=3"></script>
  <script>
    const ROUND_SIZE = 6;
    const playerCards = document.getElementById('playerCards');
    const teamCards = document.getElementById('teamCards');
    const status = document.getElementById('status');
    const scoreDisplay = document.getElementById('score');
    const streakDisplay = document.getElementById('streak');
    const roundTitle = document.getElementById('round-title');
    const newRoundButton = document.getElementById('newRound');
    const sharePanel = document.getElementById('sharePanel');
    const shareResult = document.getElementById('shareResult');
    const shareButton = document.getElementById('shareButton');
    let round = 0; let score = 0; let streak = 0; let selectedPlayer = null; let matched = 0; let totalMisses = 0;
    function shuffle(items) { return [...items].sort(() => Math.random() - .5); }
    function choosePlayers() { return shuffle(allPlayers.filter(player => player.team && player.headshot)).slice(0, ROUND_SIZE); }
    function makePlayerCard(player) {
      const card = document.createElement('button'); card.className = 'player-card'; card.type = 'button'; card.dataset.playerId = player.id;
      const image = document.createElement('img'); image.src = player.headshot; image.alt = `${player.name} headshot`; image.onerror = () => image.remove();
      const name = document.createElement('span'); name.className = 'player-name'; name.textContent = player.name; card.append(image, name);
      card.addEventListener('click', () => selectPlayer(card, player)); return card;
    }
    function makeTeamCard(team) {
      const card = document.createElement('button'); card.className = 'team-card'; card.type = 'button'; card.dataset.team = team; card.textContent = team;
      card.addEventListener('click', () => selectTeam(card, team)); return card;
    }
    function selectPlayer(card, player) {
      if (card.disabled || matched === ROUND_SIZE) return;
      document.querySelectorAll('.player-card.selected').forEach(item => item.classList.remove('selected')); card.classList.add('selected'); selectedPlayer = { card, player };
      status.textContent = `Now choose ${player.name}'s team.`; status.className = 'status';
    }
    function selectTeam(card, team) {
      if (card.disabled || !selectedPlayer || matched === ROUND_SIZE) return;
      if (selectedPlayer.player.team === team) {
        selectedPlayer.card.classList.remove('selected'); selectedPlayer.card.classList.add('matched'); card.classList.add('matched'); selectedPlayer.card.disabled = true; card.disabled = true;
        matched += 1; score += 1; streak += 1; scoreDisplay.textContent = score; streakDisplay.textContent = streak; selectedPlayer = null;
        status.textContent = matched === ROUND_SIZE ? 'Perfect round. You know your league.' : 'That is the one. Keep going.'; status.className = 'status success';
        if (matched === ROUND_SIZE) finishRound();
      } else { card.classList.add('wrong'); totalMisses += 1; streak = 0; streakDisplay.textContent = streak; status.textContent = 'Not this time. Try another team.'; status.className = 'status error'; setTimeout(() => card.classList.remove('wrong'), 350); }
    }
    function finishRound() {
      roundTitle.textContent = `Round ${round} complete`; newRoundButton.classList.remove('hidden'); document.getElementById('roundLabel').textContent = 'all matches made';
      shareResult.textContent = `${score} total matches  |  ${totalMisses} wrong guesses`;
      sharePanel.classList.remove('hidden');
    }
    function startRound() {
      round += 1; matched = 0; selectedPlayer = null; const players = choosePlayers(); playerCards.replaceChildren(...players.map(makePlayerCard)); teamCards.replaceChildren(...shuffle(players.map(player => player.team)).map(makeTeamCard));
      roundTitle.textContent = `Round ${round}`; document.getElementById('roundLabel').textContent = `${String(ROUND_SIZE).padStart(2, '0')} matches`; status.textContent = 'Select a player to get started.'; status.className = 'status'; newRoundButton.classList.add('hidden'); sharePanel.classList.add('hidden'); shareButton.textContent = 'Share my score';
    }
    shareButton.addEventListener('click', async () => {
      const shareText = `WNBA Matchup #${round}\n${score} total matches\n${totalMisses} wrong guesses\n${'🟩'.repeat(matched)}${'⬜'.repeat(ROUND_SIZE - matched)}\nCan you beat my score?`;
      try { await navigator.clipboard.writeText(shareText); shareButton.textContent = 'Score copied'; } catch { shareButton.textContent = 'Copy unavailable'; }
    });
    newRoundButton.addEventListener('click', startRound); startRound();
  </script>
</body>
</html>
