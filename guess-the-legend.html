<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WNBA Guess the Legend</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap');
    :root { --ink: #17222c; --muted: #71808b; --paper: #f5f1e9; --white: #fffdf8; --coral: #f05a47; --coral-dark: #c63e35; --mint: #b8e6d1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: Manrope, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .3; background-image: radial-gradient(#c9c2b6 1px, transparent 1px); background-size: 18px 18px; }
    main { position: relative; width: min(680px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 60px; }
    .game-nav { display: grid; gap: 2px; width: fit-content; margin-bottom: 36px; padding: 10px 14px; border-left: 3px solid var(--coral); background: rgba(255,253,248,.72); font: 12px/1.7 'DM Mono', monospace; }
    .game-nav-label { color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .game-nav a { color: var(--muted); text-decoration: none; }
    .game-nav a:hover, .game-nav a.active { color: var(--coral-dark); }
    .hub-link { display: inline-block; margin: 0 0 18px; color: var(--coral-dark); font: 11px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .08em; text-decoration: none; }
    .hub-link:hover { text-decoration: underline; }
    .kicker { margin: 0 0 8px; color: var(--coral-dark); font: 500 12px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font: 40px/1.05 'Archivo Black', sans-serif; text-transform: uppercase; }
    .intro { max-width: 480px; margin: 14px 0 24px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font: 12px 'DM Mono', monospace; }
    .progress-row strong { color: var(--coral-dark); }
    .legend-card { border: 1px solid var(--ink); background: var(--white); box-shadow: 0 8px 0 rgba(23,34,44,.08); overflow: hidden; }
    @media (min-width: 561px) {
      .legend-card.answered { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }
      .legend-card.answered .legend-photo { height: 100%; max-height: 440px; border-bottom: none; border-right: 1px solid #e7e0d2; }
      .legend-card.answered .reveal { align-self: center; }
    }
    .legend-photo { display: block; width: 100%; height: auto; max-height: min(380px, 48vh); object-fit: contain; object-position: center; background: var(--white); border-bottom: 1px solid #e7e0d2; }
    .legend-photo.missing { height: 200px; display: flex; align-items: center; justify-content: center; font: 12px 'DM Mono', monospace; color: #fffdf8; background: #68c5b4; }
    .choices { display: grid; gap: 8px; padding: 14px; }
    .choice { padding: 13px 14px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); font: 800 14px Manrope, sans-serif; text-align: left; cursor: pointer; transition: background .12s ease, color .12s ease; }
    .choice:hover:not(:disabled) { background: var(--coral); color: #fff; }
    .choice:disabled { cursor: default; }
    button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    .reveal { padding: 20px; }
    .reveal .verdict { margin: 0 0 6px; font: 11px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .12em; }
    .reveal .verdict.hit { color: #2d7d58; } .reveal .verdict.miss { color: var(--coral-dark); }
    .reveal h2 { margin: 0 0 14px; font: 30px/1.05 'Archivo Black', sans-serif; text-transform: uppercase; letter-spacing: -.02em; }
    .fact-list { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    .fact-list li { position: relative; padding-left: 18px; color: var(--ink); font-size: 15.5px; line-height: 1.6; }
    .fact-list li::before { content: ""; position: absolute; left: 0; top: 9px; width: 8px; height: 8px; background: var(--coral); }
    .fact-list strong { font-weight: 800; color: var(--coral-dark); }
    .next-button { display: block; width: 100%; margin-top: 18px; padding: 14px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font: 800 13px Manrope, sans-serif; text-transform: uppercase; cursor: pointer; }
    .next-button:hover { background: var(--coral); border-color: var(--coral); }
    .feedback { min-height: 24px; margin: 16px 0 0; color: var(--muted); font: 12px 'DM Mono', monospace; text-align: center; }
    .result-panel { margin-top: 24px; padding: 20px; border: 1px solid var(--ink); background: var(--white); text-align: center; }
    .result-panel h2 { margin: 0 0 8px; font: 24px 'Archivo Black', sans-serif; text-transform: uppercase; }
    .result-summary { margin: 0 0 14px; color: var(--muted); font: 12px/1.7 'DM Mono', monospace; white-space: pre-line; }
    .share-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .result-button { padding: 11px 18px; border: 1px solid var(--ink); background: var(--coral); color: #fff; font: 800 12px Manrope, sans-serif; text-transform: uppercase; cursor: pointer; }
    .result-button:hover { background: var(--coral-dark); border-color: var(--coral-dark); }
    .result-button.copy-button { background: var(--ink); }
    .hidden { display: none; }
    @media (max-width: 560px) {
      main { padding: 16px 0 48px; }
      .game-nav { display: flex; gap: 14px; width: auto; margin-bottom: 16px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
      .game-nav-label { display: none; }
      .game-nav a { flex: 0 0 auto; }
      .kicker { margin-bottom: 4px; }
      h1 { font-size: 26px; }
      .intro { display: none; }
      .progress-row { margin-bottom: 8px; }
      .legend-photo { max-height: min(320px, 40vh); }
      .choices { gap: 6px; padding: 10px; }
      .choice { padding: 10px 12px; font-size: 13px; }
      .reveal { padding: 16px; }
      .reveal h2 { font-size: 24px; margin-bottom: 12px; }
      .fact-list li { font-size: 14.5px; }
    }
  </style>
</head>
<body>
  <main>
    <div id="site-menu"></div>
    <header>
      <p class="kicker">WNBA / guess the legend</p>
      <h1>Name the legend.</h1>
      <p class="intro">A retired WNBA great, one photo, five names. Pick who you think it is, then read what made them a legend.</p>
    </header>
    <section aria-labelledby="roundTitle">
      <div class="progress-row"><span>Legend <strong id="roundNumber">1</strong> of <strong id="roundTotal">21</strong></span><span id="scoreTotal">0 correct</span></div>
      <h2 id="roundTitle" class="hidden">Guess the legend</h2>
      <div class="legend-card">
        <img id="legendPhoto" class="legend-photo" alt="Mystery retired WNBA player">
        <div id="choices" class="choices"></div>
        <div id="reveal" class="reveal hidden">
          <p id="revealVerdict" class="verdict"></p>
          <h2 id="revealName"></h2>
          <ul id="revealFacts" class="fact-list"></ul>
          <button id="nextButton" class="next-button" type="button">Next legend</button>
        </div>
      </div>
      <p id="feedback" class="feedback" role="status" aria-live="polite">Tap the name you think matches the photo.</p>
      <div id="resultPanel" class="result-panel hidden">
        <h2 id="resultHeading">Share your score</h2>
        <p id="resultSummary" class="result-summary"></p>
        <div class="share-actions">
          <button id="shareButton" class="result-button" type="button">Share with link</button>
          <button id="copyButton" class="result-button copy-button" type="button">Copy score</button>
        </div>
      </div>
    </section>
  </main>
  <script>
    const LEGENDS = [
      { slug: 'cynthia-cooper', name: 'Cynthia Cooper', facts: [
        '<strong>Houston Comets</strong> guard. Won the <strong>first WNBA MVP</strong> award in 1997 and again in 1998.',
        'Led the Comets to the <strong>first four WNBA titles</strong> (1997–2000) and was <strong>Finals MVP all four times</strong>.',
        '<strong>Hall of Fame</strong>, 2010.' ] },
      { slug: 'lisa-leslie', name: 'Lisa Leslie', facts: [
        '<strong>Los Angeles Sparks</strong> center. <strong>Three-time MVP</strong> (2001, 2004, 2006) and <strong>two-time champion</strong> (2001, 2002).',
        '<strong>First player to dunk</strong> in a WNBA game, in 2002.',
        'Eight-time All-Star. <strong>Hall of Fame</strong>, 2015.' ] },
      { slug: 'sheryl-swoopes', name: 'Sheryl Swoopes', facts: [
        '<strong>Houston Comets</strong> star. <strong>Three-time MVP</strong> (2000, 2002, 2005) and <strong>four-time champion</strong>.',
        '<strong>Three-time Defensive Player of the Year</strong>. Nike’s “Air Swoopes” was the <strong>first signature shoe for a woman</strong>.',
        '<strong>Hall of Fame</strong>, 2016.' ] },
      { slug: 'tina-thompson', name: 'Tina Thompson', facts: [
        'The <strong>very first pick in WNBA history</strong>, taken by the <strong>Houston Comets</strong> in 1997.',
        '<strong>Four-time champion</strong>, nine-time All-Star. Retired as the <strong>league’s all-time leading scorer</strong>.',
        '<strong>Hall of Fame</strong>, 2018.' ] },
      { slug: 'sue-bird', name: 'Sue Bird', facts: [
        '<strong>Seattle Storm</strong> point guard for 21 seasons. <strong>Four-time champion</strong> (2004, 2010, 2018, 2020).',
        '<strong>13-time All-Star</strong> and the <strong>league’s all-time assists leader</strong>.',
        '<strong>No. 1 pick</strong> in 2002 out of <strong>UConn</strong>; retired in 2022.' ] },
      { slug: 'diana-taurasi', name: 'Diana Taurasi', facts: [
        '<strong>Phoenix Mercury</strong> guard and the <strong>all-time leading scorer in WNBA history</strong>.',
        '<strong>2009 MVP</strong>, <strong>three-time champion</strong>, 11-time All-Star.',
        '<strong>No. 1 pick</strong> in 2004; retired in 2025.' ] },
      { slug: 'maya-moore', name: 'Maya Moore', facts: [
        '<strong>Minnesota Lynx</strong> forward. <strong>2014 MVP</strong> and <strong>four-time champion</strong> (2011, 2013, 2015, 2017).',
        '<strong>2013 Finals MVP</strong>.',
        '<strong>Stepped away from basketball in 2019</strong> to work on criminal-justice reform.' ] },
      { slug: 'tamika-catchings', name: 'Tamika Catchings', facts: [
        '<strong>Indiana Fever</strong> forward. <strong>2011 MVP</strong>; <strong>2012 champion and Finals MVP</strong>.',
        '<strong>Five-time Defensive Player of the Year</strong>, 10-time All-Star.',
        '<strong>Hall of Fame</strong>, 2020.' ] },
      { slug: 'candace-parker', name: 'Candace Parker', facts: [
        'Won <strong>MVP as a rookie</strong> in 2008, then <strong>MVP again</strong> in 2013.',
        '<strong>Three-time champion with three different teams</strong> — <strong>Los Angeles</strong> (2016), <strong>Chicago</strong> (2021), <strong>Las Vegas</strong> (2023).',
        'Retired in 2024.' ] },
      { slug: 'lauren-jackson', name: 'Lauren Jackson', facts: [
        '<strong>Australian</strong> center for the <strong>Seattle Storm</strong>. <strong>Three-time MVP</strong> (2003, 2007, 2010).',
        '<strong>Two-time champion</strong> (2004, 2010), seven-time All-Star.',
        '<strong>Hall of Fame</strong>, 2021.' ] },
      { slug: 'sylvia-fowles', name: 'Sylvia Fowles', facts: [
        '<strong>2017 MVP</strong>. <strong>Two-time champion and two-time Finals MVP</strong> with the <strong>Minnesota Lynx</strong>.',
        '<strong>Four-time Defensive Player of the Year</strong>.',
        'Retired in 2022 as the <strong>league’s all-time rebounding leader</strong>.' ] },
      { slug: 'seimone-augustus', name: 'Seimone Augustus', facts: [
        '<strong>No. 1 pick</strong> in 2006 and <strong>Rookie of the Year</strong> that season.',
        '<strong>Four-time champion</strong> with the <strong>Minnesota Lynx</strong>, <strong>2011 Finals MVP</strong>, eight-time All-Star.',
        'Honored with a <strong>statue outside the Lynx arena</strong>.' ] },
      { slug: 'lindsay-whalen', name: 'Lindsay Whalen', facts: [
        '<strong>Minnesota native</strong> point guard; <strong>four-time champion</strong> with the hometown <strong>Lynx</strong>.',
        'Five-time All-Star; later <strong>head coach at the University of Minnesota</strong>.',
        '<strong>Hall of Fame</strong>, 2022.' ] },
      { slug: 'swin-cash', name: 'Swin Cash', facts: [
        '<strong>Three-time champion</strong> — <strong>Detroit</strong> (2003, 2006) and <strong>Seattle</strong> (2010).',
        'Now a <strong>front-office executive with the NBA’s New Orleans Pelicans</strong>.',
        '<strong>Hall of Fame</strong>, 2022.' ] },
      { slug: 'katie-smith', name: 'Katie Smith', facts: [
        'One of the great scorers of the early era; retired as <strong>pro basketball’s all-time leading scorer</strong> across the ABL and WNBA.',
        '<strong>Two-time champion</strong> with the <strong>Detroit Shock</strong>, seven-time All-Star.',
        '<strong>Hall of Fame</strong>, 2018.' ] },
      { slug: 'yolanda-griffith', name: 'Yolanda Griffith', facts: [
        '<strong>Sacramento Monarchs</strong> center. <strong>1999 MVP and Defensive Player of the Year</strong>.',
        '<strong>2005 champion and Finals MVP</strong>; seven-time All-Star.',
        '<strong>Hall of Fame</strong>, 2021.' ] },
      { slug: 'becky-hammon', name: 'Becky Hammon', facts: [
        'Six-time All-Star guard for the <strong>New York Liberty</strong> and <strong>San Antonio</strong>.',
        'Became the <strong>first full-time female assistant coach in the NBA</strong>, then a <strong>title-winning head coach of the Las Vegas Aces</strong>.',
        '<strong>Hall of Fame</strong>, 2022.' ] },
      { slug: 'rebekkah-brunson', name: 'Rebekkah Brunson', facts: [
        'Won <strong>five WNBA titles</strong> — one with <strong>Sacramento</strong> (2005) and <strong>four with Minnesota</strong> — the <strong>most of any player</strong>.',
        'Five-time All-Star known for relentless rebounding.',
        'Later joined the Lynx coaching staff.' ] },
      { slug: 'penny-taylor', name: 'Penny Taylor', facts: [
        '<strong>Australian</strong> forward. <strong>Three-time champion</strong> with the <strong>Phoenix Mercury</strong> (2007, 2009, 2014).',
        '<strong>2014 Finals MVP</strong>, three-time All-Star.',
        'Married to fellow Mercury legend <strong>Diana Taurasi</strong>.' ] },
      { slug: 'deanna-nolan', name: 'Deanna Nolan', facts: [
        'Guard nicknamed <strong>“Tweety.”</strong> <strong>Three-time champion</strong> with the <strong>Detroit Shock</strong> (2003, 2006, 2008).',
        'Five-time All-Star.',
        'Left the WNBA at her peak to play in <strong>Russia</strong>.' ] },
      { slug: 'elena-delle-donne', name: 'Elena Delle Donne', facts: [
        '<strong>Two-time MVP</strong> (2015, 2019) and <strong>2019 champion</strong> with the <strong>Washington Mystics</strong>.',
        'In 2019, the <strong>first player ever to join the 50–40–90 club</strong> for a season.',
        '<strong>2013 Rookie of the Year</strong>.' ] },
    ];

    const shuffle = items => { const a = [...items]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

    const order = shuffle(LEGENDS);
    const rounds = order.map(legend => {
      const distractors = shuffle(LEGENDS.filter(other => other.slug !== legend.slug)).slice(0, 4);
      return { legend, options: shuffle([legend, ...distractors]) };
    });

    const legendCard = document.querySelector('.legend-card');
    const legendPhoto = document.getElementById('legendPhoto');
    const choicesBox = document.getElementById('choices');
    const roundNumber = document.getElementById('roundNumber');
    const roundTotal = document.getElementById('roundTotal');
    const scoreTotal = document.getElementById('scoreTotal');
    const reveal = document.getElementById('reveal');
    const revealName = document.getElementById('revealName');
    const revealVerdict = document.getElementById('revealVerdict');
    const revealFacts = document.getElementById('revealFacts');
    const nextButton = document.getElementById('nextButton');
    const feedback = document.getElementById('feedback');
    const resultPanel = document.getElementById('resultPanel');
    const resultHeading = document.getElementById('resultHeading');
    const resultSummary = document.getElementById('resultSummary');
    const shareButton = document.getElementById('shareButton');
    const copyButton = document.getElementById('copyButton');

    roundTotal.textContent = rounds.length;
    let roundIndex = 0;
    let score = 0;
    let answered = false;
    const marks = [];

    function renderRound() {
      const { legend, options } = rounds[roundIndex];
      answered = false;
      roundNumber.textContent = roundIndex + 1;
      reveal.classList.add('hidden');
      legendCard.classList.remove('answered');
      choicesBox.classList.remove('hidden');
      feedback.textContent = 'Tap the name you think matches the photo.';
      legendPhoto.className = 'legend-photo';
      legendPhoto.alt = 'Mystery retired WNBA player';
      legendPhoto.src = `images/legends/${legend.slug}.jpg`;
      legendPhoto.onerror = () => { legendPhoto.removeAttribute('src'); legendPhoto.classList.add('missing'); legendPhoto.alt = 'Photo unavailable'; };
      choicesBox.replaceChildren(...options.map(option => {
        const button = document.createElement('button');
        button.className = 'choice';
        button.type = 'button';
        button.textContent = option.name;
        button.addEventListener('click', () => pickAnswer(option));
        return button;
      }));
    }

    function pickAnswer(option) {
      if (answered) return;
      answered = true;
      const { legend } = rounds[roundIndex];
      const isCorrect = option.slug === legend.slug;
      if (isCorrect) score += 1;
      marks.push(isCorrect ? '🟩' : '🟥');
      scoreTotal.textContent = `${score} correct`;
      feedback.textContent = '';
      legendPhoto.alt = legend.name;
      choicesBox.classList.add('hidden');
      legendCard.classList.add('answered');
      revealVerdict.textContent = isCorrect ? 'You got it' : `You guessed ${option.name}`;
      revealVerdict.className = isCorrect ? 'verdict hit' : 'verdict miss';
      revealName.textContent = legend.name;
      revealFacts.replaceChildren(...legend.facts.map(fact => { const li = document.createElement('li'); li.innerHTML = fact; return li; }));
      nextButton.textContent = roundIndex === rounds.length - 1 ? 'See results' : 'Next legend';
      reveal.classList.remove('hidden');
      updateResultPanel();
    }

    function summaryText() {
      return `${score}/${rounds.length} legends named\n${marks.join('')}`;
    }

    function updateResultPanel() {
      resultSummary.textContent = summaryText();
      resultPanel.classList.remove('hidden');
    }

    function nextRound() {
      if (roundIndex === rounds.length - 1) {
        resultHeading.textContent = 'Roll call complete';
        updateResultPanel();
        nextButton.disabled = true;
        resultPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      roundIndex += 1;
      renderRound();
    }

    nextButton.addEventListener('click', nextRound);

    shareButton.addEventListener('click', async () => {
      const text = `WNBA Guess the Legend\n${summaryText()}\n${location.href}`;
      try { await navigator.clipboard.writeText(text); shareButton.textContent = 'Link copied'; }
      catch { shareButton.textContent = 'Copy unavailable'; }
      setTimeout(() => { shareButton.textContent = 'Share with link'; }, 1500);
    });
    copyButton.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(`WNBA Guess the Legend\n${summaryText()}`); copyButton.textContent = 'Score copied'; }
      catch { copyButton.textContent = 'Copy unavailable'; }
      setTimeout(() => { copyButton.textContent = 'Copy score'; }, 1500);
    });

    renderRound();
  </script>
  <script src="menu.js"></script>
</body>
</html>
