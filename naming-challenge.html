<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WNBA Naming Challenge</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap');
    :root { --ink: #17222c; --muted: #71808b; --paper: #f5f1e9; --white: #fffdf8; --coral: #f05a47; --coral-dark: #c63e35; --mint: #b8e6d1; }
    * { box-sizing: border-box; }
    body { position: relative; width: min(700px, calc(100% - 28px)); margin: 0 auto; padding: 34px 0 60px; color: var(--ink); background: var(--paper); font-family: Manrope, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .3; background-image: radial-gradient(#c9c2b6 1px, transparent 1px); background-size: 18px 18px; }
    .game-container { position: relative; }
    .game-nav { display: grid; gap: 2px; width: fit-content; margin-bottom: 34px; padding: 10px 14px; border-left: 3px solid var(--coral); background: rgba(255,253,248,.72); font: 12px/1.7 'DM Mono', monospace; }
    .game-nav-label { color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
    .game-nav a { color: var(--muted); text-decoration: none; }
    .game-nav a:hover, .game-nav a.active { color: var(--coral-dark); }
    .hub-link { display: inline-block; margin: 0 0 18px; color: var(--coral-dark); font: 11px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .08em; text-decoration: none; }
    .hub-link:hover { text-decoration: underline; }
    h1 { margin: 0; font: 40px/1.05 'Archivo Black', sans-serif; text-transform: uppercase; }
    h2 { margin: 0 0 8px; color: var(--coral-dark); font: 25px 'Archivo Black', sans-serif; text-transform: uppercase; }
    h3 { margin: 28px 0 10px; font: 16px 'Archivo Black', sans-serif; text-transform: uppercase; }
    .kicker { margin: 0 0 8px; color: var(--coral-dark); font: 500 12px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    .intro { max-width: 500px; margin: 14px 0 28px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .score { margin-bottom: 20px; color: var(--muted); font: 12px 'DM Mono', monospace; text-transform: uppercase; }
    .score span { color: var(--coral-dark); font: 22px 'Archivo Black', sans-serif; }
    .input-wrapper { position: relative; margin-bottom: 18px; }
    input { width: 100%; padding: 14px; color: var(--ink); font: 600 15px Manrope, sans-serif; border: 1px solid var(--ink); background: var(--white); box-shadow: 0 8px 0 rgba(23,34,44,.08); }
    input:focus { border-color: var(--coral); outline: 3px solid rgba(240,90,71,.2); }
    .dropdown { position: absolute; top: 100%; left: 0; right: 0; z-index: 2; display: none; max-height: 200px; overflow-y: auto; border: 1px solid var(--coral); border-top: none; background: var(--white); box-shadow: 6px 6px 0 rgba(23,34,44,.12); }
    .dropdown-item { padding: 12px 14px; border-bottom: 1px solid #e7e1d8; font-size: 14px; cursor: pointer; }
    .dropdown-item:hover { background: #fff0ec; color: var(--coral-dark); }
    .finish-area { margin-top: 34px; padding-top: 18px; border-top: 1px dashed #cfc8bd; }
    .action-btn { width: 100%; padding: 14px; border: 1px solid var(--ink); background: var(--ink); color: white; font: 800 13px Manrope, sans-serif; cursor: pointer; }
    .finish-area .action-btn { background: transparent; color: var(--muted); border-color: #b9b1a5; }
    .finish-area .action-btn:hover { background: #fff0ec; color: var(--coral-dark); border-color: var(--coral); }
    button:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }
    ul { list-style: none; padding: 0; margin: 0 0 30px; }
    li { padding: 10px 0; border-bottom: 1px solid #ded9d0; font-size: 14px; }
    .guessed-item { display: flex; align-items: center; }
    .guessed-img { width: 45px; height: 45px; margin-right: 15px; object-fit: cover; border-radius: 50%; background: var(--mint); }
    .guessed-text-team, .missed { color: var(--muted); }
    .position-badge { color: var(--muted); font: 11px 'DM Mono', monospace; margin-left: 5px; }
    .ppg-badge { color: var(--coral-dark); font-weight: 800; }
    .share-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
    .share-actions .action-btn { flex: 1; width: auto; }
    .copy-button { background: var(--ink); }
    .hidden { display: none; }
    @media (max-width: 520px) { body { padding-top: 24px; } h1 { font-size: 32px; } }
  </style>
</head>
<body>
  <div class="game-container">
    <div id="site-menu"></div>
    <p class="kicker">WNBA / naming challenge</p>
    <h1>Name the players.</h1>
    <p class="intro">Identify as many WNBA players as you can. Start typing a name and choose a match from the list.</p>
    <div class="score">Players Found: <span id="count">0</span> / <span id="total">0</span></div>
    <div class="input-wrapper"><input type="text" id="playerInput" placeholder="Start typing a player name..." autocomplete="off" data-bwignore="true" data-1p-ignore="true" data-lpignore="true"><div id="dropdown" class="dropdown"></div></div>
    <div class="finish-area"><button id="finishBtn" class="action-btn" type="button">Finish and show missed players</button></div>
    <div id="shareActions" class="share-actions hidden"><button id="shareBtn" class="action-btn" type="button">Share with link</button><button id="copyBtn" class="action-btn copy-button" type="button">Copy score</button></div>
    <div id="lb-mount"></div>
    <h3>Guessed Players:</h3><ul id="guessedList"></ul>
    <div id="missingSection" class="hidden"><h3>Should've Known (Sorted by PPG):</h3><ul id="missedList"></ul></div>
  </div>
  <script src="players.js?v=3"></script>
  <script src="leaderboard.js"></script>
  <script>
    const guessedPlayers = new Set();
    const input = document.getElementById('playerInput'); const dropdown = document.getElementById('dropdown'); const guessedList = document.getElementById('guessedList'); const missedList = document.getElementById('missedList');
    const countDisplay = document.getElementById('count'); const finishBtn = document.getElementById('finishBtn'); const shareActions = document.getElementById('shareActions'); const shareBtn = document.getElementById('shareBtn'); const copyBtn = document.getElementById('copyBtn'); const missingSection = document.getElementById('missingSection');
    document.getElementById('total').textContent = allPlayers.length;
    const LEADERBOARD_URL = 'https://script.google.com/macros/s/AKfycbxxFkRa3Jk0i4XxFYyduC58PG-bNg0D1WWHfUrwCRRuadnD2DYbU2n-LLnJwWfyigky/exec';
    const leaderboard = createLeaderboard({
      url: LEADERBOARD_URL,
      game: 'naming',
      mount: document.getElementById('lb-mount'),
      title: 'Most players named',
      sub: 'Finish your run to put your score on the board.',
      crownTag: 'Top Scorer',
      getScore: () => ({ score: guessedPlayers.size, total: allPlayers.length })
    });
    leaderboard.show(true);
    function normalizePlayerName(name) { return name.normalize('NFKC').replace(/[\u2018\u2019\u02BC\uFF07]/g, "'").replace(/\s+/g, ' ').trim().toLowerCase(); }
    function addPlayer(player) { if (guessedPlayers.has(player.name)) return; guessedPlayers.add(player.name); const item = document.createElement('li'); item.innerHTML = `<div class="guessed-item"><img src="${player.headshot || ''}" alt="${player.name}" class="guessed-img" onerror="this.style.display='none'"><div><strong>${player.name}</strong><br><span class="guessed-text-team">${player.team}</span></div></div>`; guessedList.insertBefore(item, guessedList.firstChild); countDisplay.textContent = guessedPlayers.size; input.value = ''; dropdown.replaceChildren(); dropdown.style.display = 'none'; }
    input.addEventListener('input', () => {
      const value = normalizePlayerName(input.value);
      dropdown.replaceChildren();
      const isShortFullName = value.length === 3 || value.length === 4;
      const matches = value.length ? allPlayers.filter(player => {
        if (guessedPlayers.has(player.name)) return false;
        const norm = normalizePlayerName(player.name);
        if (value.length >= 5 && norm.includes(value)) return true;
        if (isShortFullName && norm.split(' ').some(part => part === value)) return true;
        return false;
      }) : [];
      matches.forEach(player => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.textContent = player.name;
        item.addEventListener('click', () => addPlayer(player));
        dropdown.appendChild(item);
      });
      dropdown.style.display = matches.length ? 'block' : 'none';
      const exact = allPlayers.find(player => normalizePlayerName(player.name) === value && !guessedPlayers.has(player.name));
      if (exact) addPlayer(exact);
    });
    document.addEventListener('click', event => { if (!input.contains(event.target) && !dropdown.contains(event.target)) dropdown.style.display = 'none'; });
    finishBtn.addEventListener('click', () => {
      input.disabled = true;
      finishBtn.disabled = true;
      finishBtn.textContent = 'Game complete';
      dropdown.style.display = 'none';
      shareActions.classList.remove('hidden');
      missingSection.classList.remove('hidden');
      leaderboard.finish();
      const missed = allPlayers.filter(player => !guessedPlayers.has(player.name)).sort((a, b) => b.ppg - a.ppg);
      missed.forEach(player => {
        const item = document.createElement('li');
        item.className = 'missed';
        item.textContent = `${player.name} [${player.team}] - ${player.ppg} PPG`;
        missedList.appendChild(item);
      });
    });
    function scoreText(includeLink) { const found = guessedPlayers.size; const total = allPlayers.length; const percentage = Math.round((found / total) * 100); return `WNBA Naming Challenge\n${found}/${total} players found (${percentage}%)${includeLink ? `\n${location.href}` : ''}`; }
    shareBtn.addEventListener('click', async () => { try { await navigator.clipboard.writeText(scoreText(true)); shareBtn.textContent = 'Link copied'; setTimeout(() => { shareBtn.textContent = 'Share with link'; }, 1500); } catch { shareBtn.textContent = 'Copy unavailable'; } });
    copyBtn.addEventListener('click', async () => { try { await navigator.clipboard.writeText(scoreText(false)); copyBtn.textContent = 'Score copied'; } catch { copyBtn.textContent = 'Copy unavailable'; } });
  </script>
  <script src="menu.js"></script>
</body>
</html>
