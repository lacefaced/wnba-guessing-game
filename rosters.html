<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WNBA Roster Viewer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏀</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap');
    :root { --ink: #17222c; --muted: #71808b; --paper: #f5f1e9; --white: #fffdf8; --coral: #f05a47; --coral-dark: #c63e35; --mint: #b8e6d1; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--paper); font-family: Manrope, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .3; background-image: radial-gradient(#c9c2b6 1px, transparent 1px); background-size: 18px 18px; }
    main { position: relative; width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 34px 0 60px; }
    .kicker { margin: 0 0 8px; color: var(--coral-dark); font: 500 12px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font: 42px/1.02 'Archivo Black', sans-serif; text-transform: uppercase; }
    .intro { max-width: 570px; margin: 14px 0 28px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .selectors { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 30px; }
    .selector { display: grid; gap: 7px; }
    .selector label { color: var(--muted); font: 11px 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    select { width: 100%; min-height: 48px; padding: 13px 14px; border: 1px solid var(--ink); border-radius: 0; color: var(--ink); background: var(--white); font: 800 15px/1 Manrope, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 5px 5px 0 rgba(23,34,44,.1); }
    select:focus { outline: 3px solid rgba(240,90,71,.25); border-color: var(--coral); }
    .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .team-panel { min-width: 0; }
    .team-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 0 0 12px; }
    .team-heading h2 { min-height: 2.1em; margin: 0; font: 23px/1.05 'Archivo Black', sans-serif; text-transform: uppercase; }
    .roster-count { color: var(--muted); font: 11px 'DM Mono', monospace; }
    .scorebug { display: flex; align-items: stretch; justify-content: center; margin: 0 0 24px; border-radius: 10px; overflow: hidden; background: linear-gradient(180deg, #1c2733, #0e151c); box-shadow: 0 8px 0 rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.08); }
    .scorebug-team { display: flex; align-items: center; gap: 12px; flex: 1 1 0; padding: 14px 22px; min-width: 0; }
    .scorebug-team.team-one { justify-content: flex-end; }
    .scorebug-team.team-two { justify-content: flex-start; }
    .scorebug-logo { width: 42px; height: 42px; object-fit: contain; flex: none; }
    .scorebug-abbr { font: 800 15px 'DM Mono', monospace; letter-spacing: .06em; color: #fff; text-transform: uppercase; }
    .scorebug-score { font: 800 34px 'Archivo Black', sans-serif; color: #fff; min-width: 46px; text-align: center; line-height: 1; }
    .scorebug-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 20px; flex: none; min-width: 120px; border-left: 1px solid rgba(255,255,255,.15); border-right: 1px solid rgba(255,255,255,.15); }
    .scorebug-clock { font: 800 11px 'DM Mono', monospace; letter-spacing: .05em; color: #c3ccd4; text-transform: uppercase; text-align: center; }
    .scorebug.is-live .scorebug-clock { color: #ff8a74; }
    .scorebug-live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); animation: scorebugPulse 1.4s ease-in-out infinite; }
    .scorebug.is-final .scorebug-score, .scorebug.is-final .scorebug-abbr { color: #9aa5af; }
    @keyframes scorebugPulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
    .roster { display: grid; gap: 6px; }
    .player-card { display: grid; grid-template-columns: 50px 58px 1fr; align-items: center; min-height: 68px; padding: 4px 10px 4px 5px; border: 1px solid var(--ink); background: var(--white); box-shadow: 0 6px 0 rgba(23,34,44,.08); }
    .player-card img, .image-placeholder { width: 48px; height: 64px; object-fit: cover; object-position: top center; background: var(--mint); }
    .player-card.no-ppg img, .player-card.no-ppg .image-placeholder { width: 48px; height: 64px; }
    .number { color: var(--coral-dark); font: 24px 'Archivo Black', sans-serif; text-align: center; }
    .name { min-width: 0; padding: 0 8px; font-weight: 800; font-size: 14px; line-height: 1.2; }
    .player-meta { display: flex; gap: 8px; align-items: baseline; margin-top: 4px; }
    .position { color: var(--muted); font: 10px 'DM Mono', monospace; text-transform: uppercase; }
    .ppg { color: #2d7d58; font: 11px 'DM Mono', monospace; white-space: nowrap; }
    .no-ppg .ppg { color: var(--muted); }
    .live-pts { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
    .live-pts .pts-value { font: 900 20px 'Archivo Black', sans-serif; line-height: 1; }
    .live-pts .pts-label { font: 800 10px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .04em; }
    .live-pts.is-live .pts-value, .live-pts.is-live .pts-label { color: var(--coral-dark); }
    .live-pts.is-final .pts-value, .live-pts.is-final .pts-label { color: var(--ink); }
    .fouls-badge { display: block; margin-top: 2px; font: 800 10px 'DM Mono', monospace; text-transform: uppercase; color: var(--muted); }
    .fouls-badge.foul-trouble { color: #b35c00; }
    .fouls-badge.fouled-out { color: var(--coral-dark); }
    .milestone-badge { display: block; margin-top: 2px; font: 800 10px 'DM Mono', monospace; text-transform: uppercase; color: var(--coral-dark); }
    .availability { display: block; margin-top: 3px; color: #2d7d58; font: 9px 'DM Mono', monospace; text-transform: uppercase; }
    .availability.unavailable { color: var(--coral-dark); font-weight: 800; }
    .empty { padding: 20px; border: 1px dashed #b9b1a5; color: var(--muted); font: 12px 'DM Mono', monospace; text-align: center; }
    .quick-pick { margin-bottom: 20px; }
    .quick-pick h3 { margin: 0 0 8px; font: 11px 'DM Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .game-btn { padding: 10px; border: 1px solid var(--ink); background: var(--white); color: var(--ink); font: 600 11px Manrope, sans-serif; cursor: pointer; box-shadow: 2px 2px 0 rgba(23,34,44,.08); text-align: center; }
    .game-btn:hover { border-color: var(--coral); transform: translateY(-1px); }
    .game-time { display: block; color: var(--muted); font: 9px 'DM Mono', monospace; margin-bottom: 4px; text-transform: uppercase; }
    #quickPickSection.empty-state { text-align: center; color: var(--muted); font: 11px 'DM Mono', monospace; padding: 10px; }
    .hub-link { display: inline-block; margin: 0 0 16px; color: var(--coral-dark); font: 11px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .08em; text-decoration: none; }
    .hub-link:hover { text-decoration: underline; }
    .share-row { margin: 28px 0 0; text-align: center; }
    .share-link-btn { padding: 6px 10px; border: 1px solid transparent; background: none; color: var(--muted); font: 11px 'DM Mono', monospace; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
    .share-link-btn:hover { border-color: #cfc8bd; color: var(--coral-dark); }
    .player-card { width: 100%; color: inherit; font: inherit; text-align: left; cursor: pointer; }
    .player-card:hover { border-color: var(--coral); transform: translateY(-1px); }
    .player-card.unavailable { background: #ffd8d1; border-color: var(--coral); }
    .player-modal-backdrop { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 14px; background: rgba(23,34,44,.72); }
    .player-modal { position: relative; width: min(580px, 100%); max-height: calc(100vh - 28px); overflow-y: auto; padding: 24px; border: 1px solid var(--ink); background: var(--white); box-shadow: 10px 10px 0 rgba(23,34,44,.22); }
    .modal-close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; font: 800 18px/1 Manrope, sans-serif; }
    .modal-close:hover { background: var(--coral); color: white; }
    .modal-profile { display: grid; grid-template-columns: 150px 1fr; gap: 20px; align-items: center; padding-right: 38px; }
    .modal-profile img, .modal-image-placeholder { width: 150px; height: 190px; object-fit: cover; object-position: top center; background: var(--mint); }
    .modal-image-placeholder { display: grid; place-items: center; color: var(--muted); font: 12px 'DM Mono', monospace; }
    .modal-profile h2 { margin: 0; font: 28px/1.05 'Archivo Black', sans-serif; text-transform: uppercase; }
    .modal-subtitle { margin: 8px 0 0; color: var(--muted); font: 12px/1.5 'DM Mono', monospace; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 22px; }
    .detail { padding: 10px; border-top: 1px solid #ded9d0; }
    .detail-label { display: block; color: var(--muted); font: 10px 'DM Mono', monospace; text-transform: uppercase; }
    .detail-value { display: block; margin-top: 4px; font-weight: 800; font-size: 14px; }
    .modal-link { display: inline-block; margin-top: 18px; color: var(--coral-dark); font: 12px 'DM Mono', monospace; }
    [hidden] { display: none !important; }
    @media (max-width: 520px) { .player-modal { padding: 18px; } .modal-profile { grid-template-columns: 96px 1fr; gap: 12px; } .modal-profile img, .modal-image-placeholder { width: 96px; height: 132px; } .modal-profile h2 { font-size: 21px; } .detail-grid { gap: 6px; } .detail { padding: 8px 4px; } .detail-value { font-size: 12px; overflow-wrap: anywhere; } }
    @media (max-width: 700px) { main { padding-top: 24px; } h1 { font-size: 34px; } .selectors { gap: 12px; margin-bottom: 24px; } .comparison { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; } .team-heading { display: block; } .team-heading h2 { min-height: 2.2em; font-size: 16px; line-height: 1.1; overflow-wrap: anywhere; } .roster-count { display: block; margin-top: 5px; } .player-card { grid-template-columns: 22px 30px minmax(0, 1fr); gap: 3px; min-height: 52px; padding: 3px; } .player-card img, .image-placeholder, .player-card.no-ppg img, .player-card.no-ppg .image-placeholder { width: 30px; height: 42px; } .number { font-size: 15px; } .name { padding: 0; font-size: 10px; overflow-wrap: anywhere; } .player-meta { gap: 5px; margin-top: 2px; } .position, .ppg { font-size: 8px; } .live-pts { gap: 4px; margin-top: 2px; } .live-pts .pts-value { font-size: 14px; } .live-pts .pts-label { font-size: 7px; } .fouls-badge { font-size: 7px; margin-top: 1px; } .milestone-badge { font-size: 7px; margin-top: 1px; } .availability { font-size: 7px; } .scorebug-team { gap: 7px; padding: 10px 10px; } .scorebug-logo { width: 28px; height: 28px; } .scorebug-abbr { font-size: 11px; } .scorebug-score { font-size: 24px; min-width: 32px; } .scorebug-center { min-width: 76px; padding: 8px 10px; } .scorebug-clock { font-size: 9px; } }
  </style>
  <script src="analytics.js"></script>
</head>
<body>
  <main>
    <div id="site-menu"></div>
    <p class="kicker">WNBA / roster viewer</p>
    <h1>Compare two teams.</h1>
    <p class="intro">Choose any two teams to see their current rosters, player images, jersey numbers, positions, and points per game.</p>
    <section class="quick-pick"><h3>Quick pick</h3><div id="quickPickSection" class="games-grid"></div></section>
    <div class="selectors"><div class="selector"><label for="teamOne">Team one</label><select id="teamOne"></select></div><div class="selector"><label for="teamTwo">Team two</label><select id="teamTwo"></select></div></div>
    <div id="matchupStatus" class="scorebug" hidden></div>
    <div class="comparison"><section class="team-panel" aria-labelledby="teamOneTitle"><div class="team-heading"><h2 id="teamOneTitle"></h2><span id="teamOneCount" class="roster-count"></span></div><div id="teamOneRoster" class="roster"></div></section><section class="team-panel" aria-labelledby="teamTwoTitle"><div class="team-heading"><h2 id="teamTwoTitle"></h2><span id="teamTwoCount" class="roster-count"></span></div><div id="teamTwoRoster" class="roster"></div></section></div>
    <div class="share-row"><button id="shareLinkBtn" class="share-link-btn" type="button">Copy link to this matchup</button></div>
    <div id="playerModalBackdrop" class="player-modal-backdrop" hidden><section id="playerModal" class="player-modal" role="dialog" aria-modal="true" aria-labelledby="modalPlayerName"><button id="modalClose" class="modal-close" type="button" aria-label="Close player details">×</button><div class="modal-profile"><div id="modalImageContainer"></div><div><h2 id="modalPlayerName"></h2><p id="modalSubtitle" class="modal-subtitle"></p></div></div><div id="detailGrid" class="detail-grid"></div><a id="modalLink" class="modal-link" target="_blank" rel="noreferrer">View player profile</a></section></div>
  </main>
  <script src="players.js?v=6"></script>
  <script>
    const teamOneSelect = document.getElementById('teamOne'); const teamTwoSelect = document.getElementById('teamTwo'); const quickPickSection = document.getElementById('quickPickSection');
    const teams = [...new Set(allPlayers.map(player => player.team))].filter(Boolean).sort();

    // Today's games per team (filled in by fetchAndDisplayGames) and each live/final player's
    // current points in that game (filled in by refreshLiveStats). Both come from ESPN's public,
    // CORS-open scoreboard/summary endpoints - no backend needed.
    let gamesByTeam = {};
    let liveStats = {};
    function extractEspnId(player) { const match = /\/wnba\/players\/full\/(\d+)\.png/.exec(player.headshot || ''); return match ? match[1] : null; }

    function fetchAndDisplayGames() { fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard').then(r => r.json()).then(data => { const events = data.events || []; const localToday = new Date().toLocaleDateString('en-CA'); const todayGames = events .filter(game => { const gameDate = new Date(game.date); const gameLocalDate = gameDate.toLocaleDateString('en-CA'); return gameLocalDate === localToday; }) .sort((a, b) => new Date(a.date) - new Date(b.date)); gamesByTeam = {}; todayGames.forEach(game => { const comp = (game.competitions || [{}])[0]; const status = comp.status || {}; const state = status.type?.state || 'pre'; const statusText = status.type?.shortDetail || status.type?.description || ''; const competitors = comp.competitors || []; const gameInfo = { id: game.id, state, statusText, teams: competitors.map(c => ({ name: c.team?.displayName, score: c.score })) }; competitors.forEach(competitor => { const name = competitor.team?.displayName; if (name) gamesByTeam[name] = gameInfo; }); }); if (todayGames.length === 0) { quickPickSection.className = 'empty-state'; quickPickSection.textContent = 'No games today'; } else { quickPickSection.className = 'games-grid'; quickPickSection.replaceChildren(...todayGames.map(game => { const comp = (game.competitions || [{}])[0]; const competitors = comp.competitors || []; const [away, home] = competitors.length >= 2 ? [competitors[0].team.displayName, competitors[1].team.displayName] : []; if (!away || !home) return document.createTextNode(''); const btn = document.createElement('button'); btn.className = 'game-btn'; btn.type = 'button'; const time = new Date(game.date); btn.innerHTML = `<span class="game-time">${time.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true })}</span>${away}<br>vs<br>${home}`; btn.addEventListener('click', () => { teamOneSelect.value = away; teamTwoSelect.value = home; render(); refreshLiveStats(); updateMatchupUrl(); }); return btn; })); } refreshLiveStats(); }).catch(() => { quickPickSection.className = 'empty-state'; quickPickSection.textContent = 'Unable to load games'; }); }

    // Deep-linking: ?team1=...&team2=... pre-selects a matchup so a shared link skips the pickers.
    function matchupUrl() { const url = new URL(location.href); url.search = ''; url.searchParams.set('team1', teamOneSelect.value); url.searchParams.set('team2', teamTwoSelect.value); return url.toString(); }
    function updateMatchupUrl() { history.replaceState(null, '', matchupUrl()); }
    function applyMatchupFromUrl() {
      const params = new URLSearchParams(location.search);
      const paramTeam1 = params.get('team1'); const paramTeam2 = params.get('team2');
      if (paramTeam1 && teams.includes(paramTeam1)) teamOneSelect.value = paramTeam1;
      if (paramTeam2 && teams.includes(paramTeam2)) teamTwoSelect.value = paramTeam2;
    }
    fetchAndDisplayGames();

    function refreshLiveStats() {
      const neededEventIds = [...new Set([teamOneSelect.value, teamTwoSelect.value]
        .map(team => gamesByTeam[team])
        .filter(game => game && (game.state === 'in' || game.state === 'post'))
        .map(game => game.id))];
      if (neededEventIds.length === 0) { liveStats = {}; render(); return; }
      Promise.all(neededEventIds.map(id => fetch(`https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/summary?event=${id}`).then(r => r.json()).catch(() => null)))
        .then(results => {
          const nextStats = {};
          results.filter(Boolean).forEach(data => {
            const state = data.header?.competitions?.[0]?.status?.type?.state || 'in';
            (data.boxscore?.players || []).forEach(team => {
              (team.statistics || []).forEach(group => {
                const names = group.names || [];
                const ptsIndex = names.indexOf('PTS');
                const pfIndex = names.indexOf('PF');
                const rebIndex = names.indexOf('REB');
                const astIndex = names.indexOf('AST');
                const stlIndex = names.indexOf('STL');
                const blkIndex = names.indexOf('BLK');
                if (ptsIndex === -1) return;
                const statAt = (stats, index) => { if (index === -1) return null; const value = Number(stats[index]); return Number.isNaN(value) ? null : value; };
                (group.athletes || []).forEach(entry => {
                  const athleteId = entry.athlete?.id;
                  const stats = entry.stats || [];
                  const pts = statAt(stats, ptsIndex);
                  if (athleteId && pts != null) nextStats[athleteId] = {
                    pts, fouls: statAt(stats, pfIndex), reb: statAt(stats, rebIndex),
                    ast: statAt(stats, astIndex), stl: statAt(stats, stlIndex), blk: statAt(stats, blkIndex), state
                  };
                });
              });
            });
          });
          liveStats = nextStats;
          render();
        });
    }
    setInterval(refreshLiveStats, 45000);
    function makeImage(player) { const image = document.createElement('img'); image.src = player.headshot || ''; image.alt = `${player.name} headshot`; image.onerror = () => { const placeholder = document.createElement('span'); placeholder.className = 'image-placeholder'; image.replaceWith(placeholder); }; return image; }
    function makePlayerCard(player) { const card = document.createElement('button'); const hasPpg = Number(player.ppg) > 0; const status = player.status || 'Unknown'; const unavailable = /out|inactive|injured|suspended/i.test(status); card.className = `player-card${hasPpg ? '' : ' no-ppg'}${unavailable ? ' unavailable' : ''}`; card.type = 'button'; const number = document.createElement('span'); number.className = 'number'; number.textContent = player.jersey || '—'; const name = document.createElement('span'); name.className = 'name'; name.textContent = player.name; const meta = document.createElement('span'); meta.className = 'player-meta'; const position = document.createElement('small'); position.className = 'position'; position.textContent = player.position || 'Player'; const ppg = document.createElement('small'); ppg.className = 'ppg'; ppg.textContent = hasPpg ? `${Number(player.ppg).toFixed(1)} PPG` : 'No PPG'; meta.append(position, ppg); const live = liveStats[extractEspnId(player)]; let liveBadge = null; let foulsBadge = null; let milestoneBadge = null; if (live) { liveBadge = document.createElement('small'); liveBadge.className = `live-pts ${live.state === 'in' ? 'is-live' : 'is-final'}`; const ptsValue = document.createElement('span'); ptsValue.className = 'pts-value'; ptsValue.textContent = live.pts; const ptsLabel = document.createElement('span'); ptsLabel.className = 'pts-label'; ptsLabel.textContent = live.state === 'in' ? 'PTS · ● LIVE' : 'PTS · FINAL'; liveBadge.append(ptsValue, ptsLabel); if (live.fouls > 0) { foulsBadge = document.createElement('small'); const fouledOut = live.fouls >= 6; foulsBadge.className = `fouls-badge${fouledOut ? ' fouled-out' : live.fouls >= 5 ? ' foul-trouble' : ''}`; foulsBadge.textContent = fouledOut ? 'Fouled out' : `${live.fouls} ${live.fouls === 1 ? 'foul' : 'fouls'}`; } const doubleDigitCount = [live.pts, live.reb, live.ast, live.stl, live.blk].filter(v => Number(v) >= 10).length; if (doubleDigitCount >= 2) { milestoneBadge = document.createElement('small'); milestoneBadge.className = 'milestone-badge'; milestoneBadge.textContent = doubleDigitCount >= 3 ? '★ Triple-double' : '★ Double-double'; } } const availability = document.createElement('small'); availability.className = `availability${unavailable ? ' unavailable' : ''}`; availability.textContent = status; name.append(meta); if (liveBadge) name.append(liveBadge); if (milestoneBadge) name.append(milestoneBadge); if (foulsBadge) name.append(foulsBadge); name.append(availability); card.append(number, makeImage(player), name); card.addEventListener('click', () => openPlayerModal(player)); return card; }
    function displayValue(value) { if (value == null || value === '') return '—'; if (typeof value === 'object') return value.name || value.displayName || value.shortName || '—'; return String(value); }
    function openPlayerModal(player) { const image = makeImage(player); image.className = 'modal-image'; const imageContainer = document.getElementById('modalImageContainer'); imageContainer.replaceChildren(image); document.getElementById('modalPlayerName').textContent = player.name; document.getElementById('modalSubtitle').textContent = `${player.team}  |  #${player.jersey || '—'}  |  ${player.position || 'Player'}`; const details = [['PPG', Number(player.ppg) > 0 ? Number(player.ppg).toFixed(1) : 'No PPG'], ['Age', displayValue(player.age)], ['Height', displayValue(player.height)], ['College', displayValue(player.college)], ['Born', displayValue(player.birthPlace)], ['Experience', player.experience != null ? `${displayValue(player.experience)} seasons` : '—'], ['Status', displayValue(player.status)]]; document.getElementById('detailGrid').replaceChildren(...details.map(([label, value]) => { const detail = document.createElement('div'); detail.className = 'detail'; detail.innerHTML = `<span class="detail-label">${label}</span><span class="detail-value">${value}</span>`; return detail; })); const link = document.getElementById('modalLink'); link.hidden = !player.profile; link.href = player.profile || '#'; document.getElementById('playerModalBackdrop').hidden = false; document.body.style.overflow = 'hidden'; document.getElementById('modalClose').focus(); }
    function closePlayerModal() { document.getElementById('playerModalBackdrop').hidden = true; document.body.style.overflow = ''; }
    // Once a team's game is live or final, sort by live points only - a bench player who
    // hasn't checked in yet gets sunk to the bottom (-1) rather than borrowing their season
    // PPG, which could otherwise jump them above teammates who are actually in the game.
    function sortValue(player, hasLiveData) { const live = liveStats[extractEspnId(player)]; if (hasLiveData) return live ? live.pts : -1; return Number(player.ppg); }
    const TEAM_ABBR = { 'Atlanta Dream': 'atl', 'Chicago Sky': 'chi', 'Connecticut Sun': 'con', 'Dallas Wings': 'dal', 'Golden State Valkyries': 'gs', 'Indiana Fever': 'ind', 'Las Vegas Aces': 'lv', 'Los Angeles Sparks': 'la', 'Minnesota Lynx': 'min', 'New York Liberty': 'ny', 'Phoenix Mercury': 'phx', 'Portland Fire': 'por', 'Seattle Storm': 'sea', 'Toronto Tempo': 'tor', 'Washington Mystics': 'wsh' };
    function teamLogoUrl(team) { const abbr = TEAM_ABBR[team]; return abbr ? `https://a.espncdn.com/i/teamlogos/wnba/500/${abbr}.png` : ''; }
    function scorebugTeam(team, score, side) {
      const wrap = document.createElement('div');
      wrap.className = `scorebug-team team-${side}`;
      const logo = document.createElement('img');
      logo.className = 'scorebug-logo';
      logo.src = teamLogoUrl(team);
      logo.alt = '';
      logo.onerror = () => { logo.style.visibility = 'hidden'; };
      const abbr = document.createElement('span');
      abbr.className = 'scorebug-abbr';
      abbr.textContent = (TEAM_ABBR[team] || '').toUpperCase();
      const scoreEl = document.createElement('span');
      scoreEl.className = 'scorebug-score';
      scoreEl.textContent = score;
      if (side === 'one') wrap.append(logo, abbr, scoreEl); else wrap.append(scoreEl, abbr, logo);
      return wrap;
    }
    function renderMatchupStatus(teamOne, teamTwo) {
      const statusEl = document.getElementById('matchupStatus');
      const gameOne = gamesByTeam[teamOne];
      const gameTwo = gamesByTeam[teamTwo];
      const sameGame = gameOne && gameTwo && gameOne.id === gameTwo.id && (gameOne.state === 'in' || gameOne.state === 'post');
      if (!sameGame) { statusEl.hidden = true; statusEl.replaceChildren(); return; }
      const one = gameOne.teams.find(t => t.name === teamOne);
      const two = gameOne.teams.find(t => t.name === teamTwo);
      if (!one || !two) { statusEl.hidden = true; statusEl.replaceChildren(); return; }
      const isLive = gameOne.state === 'in';
      statusEl.className = `scorebug ${isLive ? 'is-live' : 'is-final'}`;
      const center = document.createElement('div');
      center.className = 'scorebug-center';
      if (isLive) { const dot = document.createElement('span'); dot.className = 'scorebug-live-dot'; center.append(dot); }
      const clock = document.createElement('span');
      clock.className = 'scorebug-clock';
      clock.textContent = isLive ? gameOne.statusText : 'Final';
      center.append(clock);
      statusEl.replaceChildren(scorebugTeam(teamOne, one.score, 'one'), center, scorebugTeam(teamTwo, two.score, 'two'));
      statusEl.hidden = false;
    }
    function renderTeam(team, title, count, roster) { const teamGame = gamesByTeam[team]; const hasLiveData = !!(teamGame && (teamGame.state === 'in' || teamGame.state === 'post')); const players = allPlayers.filter(player => player.team === team).sort((a, b) => sortValue(b, hasLiveData) - sortValue(a, hasLiveData) || a.name.localeCompare(b.name)); document.getElementById(title).textContent = team; document.getElementById(count).textContent = `${players.length} players`; const rosterElement = document.getElementById(roster); rosterElement.replaceChildren(...(players.length ? players.map(makePlayerCard) : [Object.assign(document.createElement('div'), { className: 'empty', textContent: 'No roster data available.' })])); }
    function render() { renderTeam(teamOneSelect.value, 'teamOneTitle', 'teamOneCount', 'teamOneRoster'); renderTeam(teamTwoSelect.value, 'teamTwoTitle', 'teamTwoCount', 'teamTwoRoster'); renderMatchupStatus(teamOneSelect.value, teamTwoSelect.value); }
    teams.forEach((team, index) => { [teamOneSelect, teamTwoSelect].forEach(select => { const option = document.createElement('option'); option.value = team; option.textContent = team; select.append(option); }); if (index === 1) teamTwoSelect.value = team; });
    applyMatchupFromUrl();
    teamOneSelect.addEventListener('change', () => { render(); refreshLiveStats(); updateMatchupUrl(); }); teamTwoSelect.addEventListener('change', () => { render(); refreshLiveStats(); updateMatchupUrl(); }); render(); updateMatchupUrl();
    document.getElementById('shareLinkBtn').addEventListener('click', async () => {
      const btn = document.getElementById('shareLinkBtn');
      try { await navigator.clipboard.writeText(matchupUrl()); btn.textContent = 'Link copied!'; }
      catch { btn.textContent = 'Copy unavailable'; }
      setTimeout(() => { btn.textContent = 'Copy link to this matchup'; }, 1500);
    });
    document.getElementById('modalClose').addEventListener('click', closePlayerModal); document.getElementById('playerModalBackdrop').addEventListener('click', event => { if (event.target.id === 'playerModalBackdrop') closePlayerModal(); }); document.addEventListener('keydown', event => { if (event.key === 'Escape') closePlayerModal(); });
  </script>
  <script src="menu.js"></script>
</body>
